name: External Link Audit

on:
  schedule:
    - cron: "37 7 * * 3"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - "hooks.py"
      - "tools/hooks.py"
      - "tools/external_link_audit.py"
      - "tests/test_external_link_audit.py"
      - "requirements.txt"
      - ".github/workflows/external-link-audit.yml"
  workflow_dispatch:

concurrency:
  group: external-link-audit-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REPORT_DIR: external-link-audit

jobs:
  audit:
    name: Build and check external links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build site
        id: build
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: python -m mkdocs build --site-dir site_external_links

      - name: Run external link audit
        if: steps.build.outcome == 'success'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          python tools/external_link_audit.py scan site_external_links \
            --json-report "$REPORT_DIR/report.json" \
            --markdown-report "$REPORT_DIR/report.md"
          cat "$REPORT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-link-audit-${{ github.run_id }}
          path: external-link-audit/
          if-no-files-found: warn
          retention-days: 14

  sync-issue:
    name: Maintain actionable-failures issue
    if: github.event_name != 'pull_request'
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download audit report
        uses: actions/download-artifact@v8
        with:
          name: external-link-audit-${{ github.run_id }}
          path: external-link-audit

      - name: Create, update, or close audit issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/external_link_audit.py sync-issue \
            --report "$REPORT_DIR/report.json" \
            --repo "${{ github.repository }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output "$REPORT_DIR/issue-action.json"
